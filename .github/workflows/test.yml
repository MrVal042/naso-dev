name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners check out with CRLF by default; the suite compares bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite makes throwaway repositories and commits in them.
      - run: git config --global user.email "ci@example.invalid" && git config --global user.name "CI"
      - run: npm test
      # The real npm and npx, started by NASO's own run(), from folders named "& (1)": on
      # Windows these are npm.cmd and npx.cmd, the shims the cmd.exe escaping exists for.
      - name: Pack the tarball and run it through the real npm and npx
        run: node test/smoke/tarball.mjs
